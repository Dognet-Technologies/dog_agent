# Dog Agent - Configurazione
# Copia questo file in /etc/dog-agent/agent.conf e adattalo.
#
# L'agent supporta più target contemporaneamente:
# ogni [[targets]] gira in un task tokio indipendente.

[agent]
# Livello di log: debug | info | warn | error
log_level = "info"

# ─────────────────────────────────────────────────────────────
# ESEMPIO: Target FireDog
# ─────────────────────────────────────────────────────────────
[[targets]]
name          = "firedog-production"
system_type   = "firedog"
# wss:// consigliato (default HTTPS del master, v1.1.0+): accetta anche
# certificati self-signed senza configurazione aggiuntiva (stessa fiducia
# già accettata lato browser per lo stesso cert). ws:// resta supportato
# per compatibilità con master installati senza HTTPS (--skip-tls).
url           = "wss://firedog.yourdomain.com"
api_key       = "YOUR_FIREDOG_API_KEY_HERE"

# Dati identità macchina (devono corrispondere a quelli configurati sul server)
# Il server calcola SHA512(ip + hostname + mac) per la fase 2 del pairing.
ip            = "192.168.1.100"
hostname      = "web-server-01"
mac           = "AA:BB:CC:DD:EE:FF"

# Intervallo heartbeat in secondi (default: 30)
heartbeat_interval  = 30

# Blocco automatico locale se score >= threat_threshold
auto_block_threats  = true
threat_threshold    = 75

# Formula threat-score (introdotta in v1.1.0, prima hardcoded). Se ometti
# questi campi, l'agent usa i default ricalibrati (vedi src/config.rs) — MENO
# aggressivi delle costanti storiche pre-v1.1.0, che rendevano troppo facile
# l'auto-block di un admin che sbaglia la password SSH qualche volta.
#
# Brute-force SSH: score = tentativi_falliti × bruteforce_score_per_attempt,
# scatta da bruteforce_min_attempts tentativi in su.
bruteforce_min_attempts       = 10
bruteforce_score_per_attempt  = 7
# SYN flood: score = connessioni_SYN_RECV × synflood_score_per_conn, scatta
# da synflood_min_connections connessioni simultanee in su.
synflood_min_connections      = 35
synflood_score_per_conn       = 2
# Questi 4 campi sono anche editabili da FireDog UI (push via WebSocket,
# CommandAction::UpdateConfig) — il push riscrive queste righe e riavvia
# dog-agent, non serve editarle a mano se lo si fa da UI.

# Path monitorati per integrità file (FireDog check_integrity)
integrity_paths = ["/etc", "/usr/bin", "/usr/sbin", "/bin", "/sbin"]

# Riconnessione a due livelli: veloce (fast_backoff_secs) per i primi
# fast_max_attempts tentativi, poi lento (slow_backoff_secs) se il server resta
# irraggiungibile. Una sessione stabile per almeno 15s fa ripartire dal livello
# veloce al prossimo errore, anche se la disconnessione è brusca.
reconnect = { fast_backoff_secs = 5, fast_max_attempts = 20, slow_backoff_secs = 1800 }

# ─────────────────────────────────────────────────────────────
# ESEMPIO: Target CyberSheppard
# ─────────────────────────────────────────────────────────────
[[targets]]
name              = "cybersheppard-main"
system_type       = "cybersheppard"
url               = "wss://cybersheppard.yourdomain.com"
api_key           = "YOUR_CYBERSHEPPARD_TOKEN_HERE"

# ID assegnato dal backend CyberSheppard a questo target
target_id         = 1

# Intervalli raccolta/invio metriche in secondi
collection_interval = 30
send_interval       = 10

# Livello compressione Zstd: 1 (veloce) .. 22 (massima), default 3
compression_level   = 3

# Buffer massimo prima del flush forzato
max_buffer_size     = 10

# Collector abilitati
collectors = { system = true, network = true, users = true, files = true, services = true, auditd = true, docker = true }

reconnect = { fast_backoff_secs = 5, fast_max_attempts = 20, slow_backoff_secs = 1800 }

# ─────────────────────────────────────────────────────────────
# ESEMPIO: Target SentinelCore (predisposto, non ancora attivo)
